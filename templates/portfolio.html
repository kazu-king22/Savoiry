{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ | Savoiry</title>
    <link rel="stylesheet" href="{% static 'css/portfolio.css' %}">
</head>
<body class="portfolio-page">

    <!-- ポートフォリオ見出し -->
    <div class="portfolio-header">
        <p class="portfolio-label">ポートフォリオ</p>
        <h1 class="portfolio-title">Savoiry</h1>
        <p class="portfolio-subtitle">飲食店記録アプリ</p>
    </div>
    
    {% load static %}
    <!-- スクリーンショット -->
    <div class="screenshot">
        <img src="{% static 'media/portfolio_screenshot1_v2.png' %}" alt="Savoiry ホーム画面">
        <img src="{% static 'media/portfolio_screenshot2_v2.png' %}" alt="Savoiry 行った一覧画面">
        <img src="{% static 'media/portfolio_screenshot3_v6.PNG' %}" alt="Savoiry 店舗詳細画面">
        <img src="{% static 'media/portfolio_screenshot4_v2.png' %}" alt="Savoiry マイページ画面">
    </div>

    <!-- 説明文 -->
    <p>
        Savoiry（サヴォアリー）は、SNSやWEBページに分散しがちな飲食店情報を一括で整理・保存できる
        自分専用の飲食店記録アプリです。<br>
        保存した情報を「エリア・グループ・ジャンル・シーン・タグ」から検索でき、
        「このお店、行きたかったのに思い出せなかった…」という機会を減らします。<br>
        実際に訪れたお店の感想や写真も記録でき、体験を“思い出”として残せます。
    </p>

    <!-- 資料リンク -->
    <div class="project-links">
        <a href="/media/Savoiry_企画書.pdf" target="_blank">企画書</a>
        <a href="/media/Savoiry_画面設計図_v3.pdf" target="_blank">画面設計図</a>
        <a href="/media/Savoiry_画面遷移図.svg" target="_blank">画面遷移図</a>
        <a href="/media/Savoiry_ER図.svg" target="_blank">ER図</a>
    </div>

    <!-- アクセス -->
    <div class="access-container">
        <a href="{% url 'accounts:login' %}" class="access-btn">
            アプリにアクセス
        </a>
    </div>

</body>
</html>
